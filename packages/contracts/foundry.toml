[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
deny = "warnings"
ignored_warnings_from = ["lib"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./config" },
]
# test/v4 deploys Uniswap's PoolManager, which pins solc 0.8.26; see [profile.v4].
skip = ["test/v4/**"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
]
gas_reports = ["BudgetAccount", "BudgetAccountFactory", "BurnVault", "CreatorRegistry"]

[lint]
# Expiry and deadline checks compare against block.timestamp by design.
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 1024
max_test_rejects = 131072

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.v4]
solc_version = "0.8.26"
skip = []
out = "out/v4"
cache_path = "cache/v4"

[profile.ci]
fuzz = { runs = 8192 }
invariant = { runs = 1024, depth = 128 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
robinhood = "${RPC_URL_4663}"
